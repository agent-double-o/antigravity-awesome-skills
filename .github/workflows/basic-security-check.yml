name: Basic Security Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Check for suspicious files
        run: |
          echo "Checking for risky files..."
          find . -type f \( \
            -name "*.pem" -o \
            -name "*.key" -o \
            -name "*.p12" -o \
            -name "*.pfx" -o \
            -name ".env" -o \
            -name "id_rsa" -o \
            -name "id_ed25519" \
          \) -print -exec false {} +

      - name: Check for common secret words
        run: |
          echo "Checking for suspicious secret keywords..."
          if grep -RInE "(api[_-]?key|secret|token|password|private[_-]?key)" . \
            --exclude-dir=.git \
            --exclude-dir=node_modules; then
            echo "Potential secret keyword found. Please review."
            exit 1
          else
            echo "No obvious secret keywords found."
          fi
